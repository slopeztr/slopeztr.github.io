<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>Falsedad — El Juicio de la Verdad</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0d0a07;
  --surface:#1a1410;
  --surface2:#241c14;
  --gold:#c9a84c;
  --gold2:#e8c96a;
  --red:#8b2020;
  --red2:#c0392b;
  --cream:#f0e6d0;
  --cream2:#d4c4a0;
  --text:#e8dcc8;
  --text-soft:#a09070;
  --white:#fff8ef;
  --shadow:0 8px 40px rgba(0,0,0,0.6);
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Crimson Pro',serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100dvh;}

/* SCROLLING PANEL */
#app{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;}

/* ── HEADER ── */
#top-bar{
  position:sticky;top:0;z-index:50;
  background:linear-gradient(180deg,#0d0a07 80%,transparent);
  padding:14px 18px 10px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
#rank-display{
  display:flex;align-items:center;gap:8px;
  background:var(--surface);
  border:1px solid var(--gold);
  border-radius:30px;padding:5px 14px;
}
#rank-icon{font-size:1.3rem;}
#rank-name{font-family:'Cinzel',serif;font-size:0.7rem;color:var(--gold);letter-spacing:1px;}
#progress-wrap{flex:1;display:flex;flex-direction:column;gap:3px;}
#progress-label{font-size:0.68rem;color:var(--text-soft);text-align:right;}
#progress-track{height:6px;background:var(--surface2);border-radius:4px;overflow:hidden;}
#progress-fill{height:6px;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:4px;width:0%;transition:width 0.6s ease;}
#score-chip{
  background:var(--surface);border:1px solid var(--gold);
  border-radius:20px;padding:5px 12px;
  font-family:'Cinzel',serif;font-size:0.75rem;color:var(--gold2);
  white-space:nowrap;
}

/* ── HOME SCREEN ── */
#home{display:block;padding:24px 20px 40px;text-align:center;animation:fadeIn 0.6s ease;}
.scroll-ornament{font-size:3.5rem;margin-bottom:8px;filter:drop-shadow(0 0 20px rgba(201,168,76,0.5));}
#home h1{font-family:'Cinzel',serif;font-size:clamp(1.6rem,6vw,2.4rem);color:var(--gold);line-height:1.2;margin-bottom:6px;}
#home .subtitle{font-size:1rem;color:var(--cream2);font-style:italic;margin-bottom:4px;}
#home .verse{font-size:0.82rem;color:var(--text-soft);margin-bottom:28px;}
.modules-grid{display:flex;flex-direction:column;gap:10px;max-width:480px;margin:0 auto;}
.module-btn{
  background:var(--surface);
  border:1px solid #3a2e1e;
  border-radius:var(--radius);
  padding:14px 18px;
  display:flex;align-items:center;gap:14px;
  cursor:pointer;transition:all 0.2s;text-align:left;
  position:relative;overflow:hidden;
}
.module-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(201,168,76,0.05),transparent);pointer-events:none;}
.module-btn:active{transform:scale(0.97);}
.module-btn.unlocked{border-color:rgba(201,168,76,0.3);}
.module-btn.completed{border-color:var(--gold);background:linear-gradient(135deg,#1e1a0f,var(--surface));}
.module-btn.locked{opacity:0.45;cursor:not-allowed;}
.mod-icon{font-size:1.8rem;flex-shrink:0;}
.mod-info{flex:1;}
.mod-num{font-size:0.65rem;color:var(--text-soft);letter-spacing:2px;text-transform:uppercase;font-family:'Cinzel',serif;}
.mod-title{font-family:'Cinzel',serif;font-size:0.88rem;color:var(--cream);margin-top:2px;}
.mod-desc{font-size:0.75rem;color:var(--text-soft);margin-top:2px;font-style:italic;}
.mod-status{font-size:1.2rem;flex-shrink:0;}
.difficulty-dots{display:flex;gap:3px;margin-top:4px;}
.difficulty-dots span{width:6px;height:6px;border-radius:50%;background:var(--surface2);}
.difficulty-dots span.lit{background:var(--gold);}

/* ── QUIZ SCREEN ── */
#quiz-screen{display:block;padding:16px 18px 40px;max-width:520px;margin:0 auto;}
.quiz-header{margin-bottom:20px;}
.quiz-module-title{font-family:'Cinzel',serif;font-size:0.75rem;color:var(--gold);letter-spacing:2px;text-transform:uppercase;}
.quiz-question-num{font-size:0.7rem;color:var(--text-soft);margin-top:2px;}
.q-progress{display:flex;gap:4px;margin-top:10px;}
.q-pip{flex:1;height:4px;border-radius:2px;background:var(--surface2);transition:background 0.3s;}
.q-pip.done{background:var(--gold);}
.q-pip.current{background:var(--gold2);}

.question-card{
  background:var(--surface);
  border:1px solid #3a2e1e;
  border-radius:var(--radius);
  padding:22px 18px;
  margin-bottom:16px;
  animation:slideUp 0.35s ease;
}
@keyframes slideUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.q-type-badge{
  display:inline-block;
  font-size:0.62rem;letter-spacing:1.5px;text-transform:uppercase;font-family:'Cinzel',serif;
  color:var(--gold);border:1px solid rgba(201,168,76,0.4);
  border-radius:20px;padding:2px 10px;margin-bottom:12px;
}
.q-text{font-size:1.05rem;color:var(--cream);line-height:1.55;margin-bottom:18px;}
.q-verse{font-size:0.8rem;color:var(--text-soft);font-style:italic;margin-bottom:14px;}

/* Multiple choice */
.choices{display:flex;flex-direction:column;gap:8px;}
.choice-btn{
  background:var(--surface2);border:1.5px solid #3a2e1e;
  border-radius:10px;padding:12px 16px;
  font-family:'Crimson Pro',serif;font-size:0.95rem;color:var(--text);
  cursor:pointer;text-align:left;transition:all 0.18s;
  touch-action:manipulation;
}
.choice-btn:active{transform:scale(0.97);}
.choice-btn.selected{border-color:var(--gold);background:#2a2010;color:var(--gold2);}
.choice-btn.correct{border-color:#2e7d5e;background:#0d2a1e;color:#6fcf97;}
.choice-btn.wrong{border-color:var(--red2);background:#2a0d0d;color:#eb5757;}

/* Fill blank */
.fill-wrap{position:relative;}
.fill-input{
  width:100%;background:var(--surface2);
  border:1.5px solid #3a2e1e;border-radius:10px;
  padding:12px 16px;font-family:'Crimson Pro',serif;font-size:1rem;
  color:var(--cream);outline:none;
  transition:border-color 0.2s;
}
.fill-input:focus{border-color:var(--gold);}
.fill-input.correct{border-color:#2e7d5e;background:#0d2a1e;color:#6fcf97;}
.fill-input.wrong{border-color:var(--red2);background:#2a0d0d;color:#eb5757;}

/* True/False */
.tf-wrap{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.tf-btn{
  background:var(--surface2);border:1.5px solid #3a2e1e;
  border-radius:10px;padding:14px;
  font-family:'Cinzel',serif;font-size:0.85rem;
  cursor:pointer;text-align:center;transition:all 0.18s;
  touch-action:manipulation;
}
.tf-btn:active{transform:scale(0.96);}
.tf-btn.selected{border-color:var(--gold);background:#2a2010;color:var(--gold2);}
.tf-btn.correct{border-color:#2e7d5e;background:#0d2a1e;color:#6fcf97;}
.tf-btn.wrong{border-color:var(--red2);background:#2a0d0d;color:#eb5757;}

/* Memory match */
.memory-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.mem-card{
  background:var(--surface2);border:1.5px solid #3a2e1e;
  border-radius:10px;padding:12px 10px;
  font-family:'Crimson Pro',serif;font-size:0.85rem;color:var(--cream);
  cursor:pointer;text-align:center;line-height:1.3;
  transition:all 0.2s;min-height:60px;display:flex;align-items:center;justify-content:center;
  touch-action:manipulation;
}
.mem-card:active{transform:scale(0.96);}
.mem-card.selected{border-color:var(--gold);background:#2a2010;color:var(--gold2);}
.mem-card.matched{border-color:#2e7d5e;background:#0d2a1e;color:#6fcf97;cursor:default;}
.mem-card.wrong-flash{border-color:var(--red2);background:#2a0d0d;animation:flash 0.5s ease;}
@keyframes flash{0%,100%{opacity:1;}50%{opacity:0.4;}}
.memory-instructions{font-size:0.78rem;color:var(--text-soft);font-style:italic;margin-bottom:10px;}

/* Order */
.order-list{display:flex;flex-direction:column;gap:6px;}
.order-item{
  background:var(--surface2);border:1.5px solid #3a2e1e;
  border-radius:10px;padding:11px 14px;
  font-family:'Crimson Pro',serif;font-size:0.9rem;color:var(--cream);
  cursor:pointer;display:flex;align-items:center;gap:10px;
  transition:all 0.18s;touch-action:manipulation;
}
.order-item:active{transform:scale(0.97);}
.order-item.selected-order{border-color:var(--gold);background:#2a2010;}
.order-item.correct{border-color:#2e7d5e;background:#0d2a1e;color:#6fcf97;}
.order-item.wrong{border-color:var(--red2);background:#2a0d0d;color:#eb5757;}
.order-num{font-family:'Cinzel',serif;font-size:0.75rem;color:var(--gold);width:18px;text-align:center;flex-shrink:0;}

/* Feedback */
.feedback-box{
  border-radius:10px;padding:14px 16px;margin-top:14px;
  font-size:0.88rem;line-height:1.5;display:none;
  animation:slideUp 0.3s ease;
}
.feedback-box.correct{background:#0d2a1e;border:1px solid #2e7d5e;color:#6fcf97;}
.feedback-box.wrong{background:#2a0d0d;border:1px solid var(--red2);color:#eb8a8a;}
.feedback-icon{font-size:1.2rem;margin-bottom:4px;}

/* Nav buttons */
.quiz-nav{display:flex;gap:10px;margin-top:6px;}
.nav-btn{
  flex:1;padding:14px;border-radius:10px;border:none;
  font-family:'Cinzel',serif;font-size:0.82rem;letter-spacing:1px;
  cursor:pointer;transition:all 0.2s;touch-action:manipulation;
}
.nav-btn-primary{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#0d0a07;font-weight:700;}
.nav-btn-primary:active{transform:scale(0.97);}
.nav-btn-secondary{background:var(--surface2);color:var(--text-soft);border:1px solid #3a2e1e;}

/* ── MODULE COMPLETE ── */
#module-complete{display:block;padding:30px 24px;text-align:center;animation:fadeIn 0.5s ease;max-width:480px;margin:0 auto;}
.complete-icon{font-size:4rem;margin-bottom:12px;}
.complete-title{font-family:'Cinzel',serif;font-size:1.5rem;color:var(--gold);margin-bottom:8px;}
.complete-score{font-size:3rem;font-weight:700;color:var(--gold2);margin:10px 0;}
.complete-msg{font-size:0.95rem;color:var(--cream2);font-style:italic;margin-bottom:24px;line-height:1.6;}
.stars-row{display:flex;justify-content:center;gap:8px;font-size:2rem;margin-bottom:20px;}

/* ── RANK UNLOCK ── */
#rank-unlock{
  display:none;position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,0.85);
  align-items:center;justify-content:center;
  animation:fadeIn 0.3s ease;
}
#rank-unlock.show{display:flex;}
.rank-unlock-card{
  background:linear-gradient(135deg,#1e1a0f,var(--surface));
  border:2px solid var(--gold);border-radius:20px;
  padding:36px 28px;text-align:center;max-width:320px;width:90%;
  animation:pop 0.4s cubic-bezier(.34,1.56,.64,1);
  box-shadow:0 0 60px rgba(201,168,76,0.3);
}
@keyframes pop{from{transform:scale(0.7);opacity:0;}to{transform:scale(1);opacity:1;}}
.rank-unlock-icon{font-size:4.5rem;margin-bottom:12px;}
.rank-unlock-title{font-family:'Cinzel',serif;font-size:0.75rem;letter-spacing:3px;color:var(--text-soft);margin-bottom:6px;}
.rank-unlock-name{font-family:'Cinzel',serif;font-size:1.8rem;color:var(--gold);margin-bottom:10px;}
.rank-unlock-desc{font-size:0.88rem;color:var(--cream2);font-style:italic;line-height:1.5;margin-bottom:20px;}

/* ── TOAST ── */
#toast{
  position:fixed;bottom:24px;left:50%;
  transform:translateX(-50%) translateY(80px);
  background:var(--surface);border:1px solid var(--gold);
  color:var(--gold2);padding:9px 22px;border-radius:30px;
  font-family:'Cinzel',serif;font-size:0.75rem;letter-spacing:1px;
  z-index:300;transition:transform 0.3s ease;pointer-events:none;white-space:nowrap;
}
#toast.show{transform:translateX(-50%) translateY(0);}

/* ── UTILS ── */
.gold-btn{
  background:linear-gradient(135deg,var(--gold),var(--gold2));color:#0d0a07;
  border:none;border-radius:10px;padding:14px 28px;
  font-family:'Cinzel',serif;font-size:0.85rem;font-weight:700;letter-spacing:1px;
  cursor:pointer;transition:all 0.2s;touch-action:manipulation;width:100%;
}
.gold-btn:active{transform:scale(0.97);}
.ghost-btn{
  background:transparent;color:var(--text-soft);
  border:1px solid #3a2e1e;border-radius:10px;padding:12px 28px;
  font-family:'Cinzel',serif;font-size:0.82rem;
  cursor:pointer;transition:all 0.2s;touch-action:manipulation;width:100%;margin-top:8px;
}

.separator{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:20px 0;opacity:0.3;}
</style>
</head>
<body>
<div id="app">
  <!-- TOP BAR -->
  <div id="top-bar">
    <div id="rank-display">
      <span id="rank-icon">⚔️</span>
      <span id="rank-name">FILISTEO</span>
    </div>
    <div id="progress-wrap">
      <div id="progress-label">0 / 50 preguntas</div>
      <div id="progress-track"><div id="progress-fill"></div></div>
    </div>
    <div id="score-chip">⭐ 0</div>
  </div>

  <!-- HOME -->
  <div id="home">
    <div class="scroll-ornament">📜</div>
    <h1>FALSEDAD</h1>
    <div class="subtitle">El Juicio de la Verdad</div>
    <div class="verse">Marcos 11:15–19 · Marcos 12:28–34</div>
    <div class="separator"></div>
    <div class="modules-grid" id="modules-grid"></div>
  </div>

  <!-- QUIZ -->
  <div id="quiz-screen">
    <div class="quiz-header">
      <div class="quiz-module-title" id="qm-title"></div>
      <div class="quiz-question-num" id="qm-num"></div>
      <div class="q-progress" id="q-pips"></div>
    </div>
    <div id="question-area"></div>
    <div class="quiz-nav" id="quiz-nav"></div>
  </div>

  <!-- MODULE COMPLETE -->
  <div id="module-complete">
    <div class="complete-icon" id="mc-icon">🏛️</div>
    <div class="complete-title" id="mc-title">Módulo Completo</div>
    <div class="stars-row" id="mc-stars"></div>
    <div class="complete-score" id="mc-score"></div>
    <div class="complete-msg" id="mc-msg"></div>
    <button class="gold-btn" id="mc-next-btn">Continuar</button>
    <button class="ghost-btn" onclick="goHome()">← Volver al inicio</button>
  </div>
</div>

<!-- RANK UNLOCK OVERLAY -->
<div id="rank-unlock" data-flex="1">
  <div class="rank-unlock-card">
    <div class="rank-unlock-icon" id="ru-icon"></div>
    <div class="rank-unlock-title">NUEVA INSIGNIA DESBLOQUEADA</div>
    <div class="rank-unlock-name" id="ru-name"></div>
    <div class="rank-unlock-desc" id="ru-desc"></div>
    <button class="gold-btn" onclick="closeRankUnlock()">¡Continuar!</button>
  </div>
</div>

<div id="toast"></div>

<script>
// ══════════════════════════════════════════════════════════
// DATA
// ══════════════════════════════════════════════════════════
const RANKS = [
  { min:0,  max:19,  icon:'⚔️',  name:'Filisteo',         desc:'Apenas comienzas a conocer la Verdad. Los filisteos también la encontraron, pero no la quisieron.' },
  { min:20, max:39,  icon:'🏛️',  name:'Fariseo',          desc:'Conoces la ley, pero ¿la vives? Los fariseos sabían mucho y cambiaron poco.' },
  { min:40, max:59,  icon:'🌍',  name:'Gentil',           desc:'Te acercas a la Verdad desde afuera. Como el gentil que busca con el corazón abierto.' },
  { min:60, max:79,  icon:'🤝',  name:'Simpatizante',     desc:'Tu corazón responde. Como quienes escuchaban a Jesús con genuino interés.' },
  { min:80, max:99,  icon:'✝️',  name:'Discípulo',        desc:'Caminas en la senda. El discípulo no solo aprende, sino que obedece.' },
  { min:100,max:100, icon:'👑',  name:'Siervo de Cristo', desc:'¡Completaste el camino! Como el escriba sincero, comprendiste lo que más importa.' },
];

const MODULES = [
  {
    id:1, icon:'🕊️', title:'El Templo Corrompido', difficulty:1,
    desc:'Introducción al contexto histórico',
    questions:[
      { type:'mc', text:'¿A qué ciudad llegó Jesús al inicio de esta lección?', choices:['Belén','Nazaret','Jerusalén','Capernaum'], answer:2, verse:'Marcos 11:15', feedback:'Jesús entró a Jerusalén entre el clamor de la multitud antes de dirigirse al Templo.' },
      { type:'tf', text:'Jesús actuó con miedo al ver lo que ocurría en el Templo, por eso esperó antes de actuar.', answer:false, verse:'Marcos 11:15-16', feedback:'Al contrario, Jesús actuó con autoridad divina, echando a los que vendían y compraban.' },
      { type:'fill', text:'Jesús llamó al Templo una "cueva de ___________", pues había sido convertido en un mercado corrupto.', answer:'ladrones', verse:'Marcos 11:17', feedback:'Jesús citó a Jeremías 7:11 al decir que habían convertido la casa de Dios en una "cueva de ladrones".' },
      { type:'mc', text:'¿Qué animales se vendían en el Templo a precios exorbitantes?', choices:['Bueyes y ovejas','Palomas y otros animales','Camellos y burros','Solo palomas'], answer:1, verse:'Marcos 11:15', feedback:'El Templo se había llenado de vendedores de palomas y otros animales para los sacrificios.' },
      { type:'tf', text:'Los cambistas del Templo manipulaban el tipo de cambio de la divisa romana para su propio beneficio.', answer:true, verse:'Marcos 11:15', feedback:'El cambio se fijaba abusivamente a favor de los responsables del Templo, enriqueciéndose a costa de los adoradores.' },
    ]
  },
  {
    id:2, icon:'😡', title:'El Enojo Justo', difficulty:1,
    desc:'La acción de Jesús en el Templo',
    questions:[
      { type:'mc', text:'¿Qué hizo Jesús al llegar al Templo y ver la corrupción?', choices:['Predicó una larga parábola','Echó a todos los que vendían y compraban','Se fue sin decir nada','Habló con los sacerdotes en privado'], answer:1, verse:'Marcos 11:15', feedback:'Jesús fue directamente al Templo y echó a los que vendían y compraban, volcando las mesas de los cambistas.' },
      { type:'tf', text:'El enojo de Jesús en el Templo fue una reacción impulsiva sin fundamento espiritual.', answer:false, verse:'Marcos 11:17', feedback:'Su enojo fue justo y fundamentado: la casa de oración de Dios había sido profanada.' },
      { type:'fill', text:'La casa de Dios debía ser llamada casa de ___________ para todas las naciones.', answer:'oración', verse:'Marcos 11:17', feedback:'Jesús citó a Isaías 56:7: "Mi casa será llamada casa de oración para todas las naciones".' },
      { type:'order', text:'Ordena las acciones de Jesús en el Templo en el orden correcto:', items:['Volcó las mesas de los cambistas','Llegó al Templo','Enseñó al pueblo','Echó a los vendedores y compradores'], correctOrder:[1,3,0,2], feedback:'Jesús llegó, echó a los que comerciaban, volcó las mesas y luego enseñó a la multitud.' },
      { type:'mc', text:'¿Por qué los judíos no podían resistir las acciones de Jesús según el texto?', choices:['Tenía un ejército','Su autoridad espiritual era evidente','Tenía miedo de ser detenido','Los soldados romanos lo protegían'], answer:1, verse:'Marcos 11', feedback:'El Señor actuó con reservas de poder y autoridad divinos, ante las cuales los truhanes eran incapaces de resistirse.' },
    ]
  },
  {
    id:3, icon:'🎭', title:'La Hipocresía Religiosa', difficulty:2,
    desc:'El pecado de los dirigentes',
    questions:[
      { type:'mc', text:'¿Cómo describe el texto la actitud de los dirigentes religiosos ante la conducta fraudulenta en el Templo?', choices:['La denunciaban públicamente','Se oponían a ella en privado','Se encogían de hombros','La reportaban a Roma'], answer:2, verse:'Marcos 11', feedback:'Muchos judíos se encogían de hombros ante esta conducta fraudulenta, pero el Señor Jesús se llenó de indignación.' },
      { type:'tf', text:'Los dirigentes religiosos eran genuinamente devotos a Dios pero cometían errores involuntarios.', answer:false, verse:'Marcos 11', feedback:'Lejos de temer a Dios, estos dirigentes religiosos estaban allí para llenarse los bolsillos con extorsión.' },

let state = {
  completedModules: JSON.parse(localStorage.getItem('falsedad_completed') || '[]'),
  scores: JSON.parse(localStorage.getItem('falsedad_scores') || '{}'),
  totalCorrect: parseInt(localStorage.getItem('falsedad_total') || '0'),
  currentRank: 0,
};

let quiz = { moduleIdx:0, questionIdx:0, answers:[], correct:0, answered:false, memPairs:[], memSelected:null, memMatched:[], orderSelected:[] };

// ══════════════════════════════════════════════════════════
// RANKS
// ══════════════════════════════════════════════════════════
function getProgress() {
  const total = MODULES.length * 5;
  return Math.round((state.totalCorrect / total) * 100);
}

function getCurrentRank() {
  const p = getProgress();
  return RANKS.findLast(r => p >= r.min) || RANKS[0];
}

function updateTopBar() {
  const rank = getCurrentRank();
  document.getElementById('rank-icon').textContent = rank.icon;
  document.getElementById('rank-name').textContent = rank.name.toUpperCase();
  const p = getProgress();
  document.getElementById('progress-fill').style.width = p + '%';
  document.getElementById('progress-label').textContent = `${state.totalCorrect} / ${MODULES.length*5} preguntas`;
  document.getElementById('score-chip').textContent = `⭐ ${state.totalCorrect}`;
}

// ══════════════════════════════════════════════════════════
// HOME
// ══════════════════════════════════════════════════════════
function renderHome() {
  show('home'); hide('quiz-screen'); hide('module-complete');
  const grid = document.getElementById('modules-grid');
  grid.innerHTML = '';
  MODULES.forEach((mod, i) => {
    const done = state.completedModules.includes(mod.id);
    const unlocked = i === 0 || state.completedModules.includes(MODULES[i-1].id);
    const btn = document.createElement('div');
    btn.className = 'module-btn ' + (done ? 'completed' : unlocked ? 'unlocked' : 'locked');
    const dots = Array(5).fill(0).map((_,d) => `<span class="${d < mod.difficulty ? 'lit':''}"></span>`).join('');
    const score = state.scores[mod.id];
    btn.innerHTML = `
      <div class="mod-icon">${mod.icon}</div>
      <div class="mod-info">
        <div class="mod-num">Módulo ${mod.id}</div>
        <div class="mod-title">${mod.title}</div>
        <div class="mod-desc">${mod.desc}</div>
        <div class="difficulty-dots">${dots}</div>
      </div>
      <div class="mod-status">${done ? (score===5?'⭐':'✅') : unlocked ? '▶️' : '🔒'}</div>
    `;
    if (unlocked) btn.addEventListener('click', () => startModule(i));
    grid.appendChild(btn);
  });
  updateTopBar();
}

function goHome() { saveState(); renderHome(); }

// ══════════════════════════════════════════════════════════
// QUIZ
// ══════════════════════════════════════════════════════════
function startModule(idx) {
  quiz = { moduleIdx:idx, questionIdx:0, answers:[], correct:0, answered:false, memPairs:[], memSelected:null, memMatched:[], orderSelected:[] };
  hide('home'); hide('module-complete');
  show('quiz-screen');
  renderQuestion();
  document.getElementById('app').scrollTo(0,0);
}

function renderQuestion() {
  const mod = MODULES[quiz.moduleIdx];
  const q = mod.questions[quiz.questionIdx];
  quiz.answered = false;
  quiz.memSelected = null;
  quiz.memMatched = [];
  quiz.orderSelected = [];

  document.getElementById('qm-title').textContent = `${mod.icon} ${mod.title}`;
  document.getElementById('qm-num').textContent = `Pregunta ${quiz.questionIdx+1} de ${mod.questions.length}`;

  // Pips
  const pips = document.getElementById('q-pips');
  pips.innerHTML = mod.questions.map((_,i) => {
    let cls = i < quiz.questionIdx ? 'q-pip done' : i===quiz.questionIdx ? 'q-pip current' : 'q-pip';
    return `<div class="${cls}"></div>`;
  }).join('');

  // Question area
  const area = document.getElementById('question-area');
  area.innerHTML = '';
  const card = document.createElement('div');
  card.className = 'question-card';

  const typeLabels = {mc:'Selección múltiple',tf:'Verdadero o Falso',fill:'Completar',memory:'Parejas',order:'Ordenar'};
  card.innerHTML = `<div class="q-type-badge">${typeLabels[q.type]||q.type}</div><div class="q-text">${q.text}</div>${q.verse?`<div class="q-verse">📖 ${q.verse}</div>`:''}`;

  // Build question UI
  let questionUI = '';
  if (q.type==='mc') questionUI = buildMC(q);
  else if (q.type==='tf') questionUI = buildTF(q);
  else if (q.type==='fill') questionUI = buildFill(q);
  else if (q.type==='memory') { card.appendChild(buildMemory(q)); }
  else if (q.type==='order') { card.appendChild(buildOrder(q)); }

  if (questionUI) card.innerHTML += questionUI;

  const fb = document.createElement('div');
  fb.className = 'feedback-box'; fb.id = 'feedback-box';
  card.appendChild(fb);
  area.appendChild(card);

  // Nav
  const nav = document.getElementById('quiz-nav');
  nav.innerHTML = '';
  if (quiz.questionIdx > 0) {
    // no back btn for simplicity
  }
  const nextBtn = document.createElement('button');
  nextBtn.className = 'nav-btn nav-btn-primary'; nextBtn.id = 'next-btn';
  nextBtn.textContent = quiz.answered ? (quiz.questionIdx < mod.questions.length-1 ? 'Siguiente →' : 'Finalizar módulo') : 'Confirmar';
  nextBtn.addEventListener('click', onNextOrConfirm);
  nav.appendChild(nextBtn);
}

function buildMC(q) {
  return `<div class="choices">${q.choices.map((c,i)=>`<button class="choice-btn" onclick="selectChoice(${i})">${c}</button>`).join('')}</div>`;
}
function buildTF(q) {
  return `<div class="tf-wrap"><button class="tf-btn" onclick="selectTF(true)">✅ Verdadero</button><button class="tf-btn" onclick="selectTF(false)">❌ Falso</button></div>`;
}
function buildFill(q) {
  return `<div class="fill-wrap"><input class="fill-input" id="fill-input" type="text" placeholder="Escribe tu respuesta..." autocomplete="off" autocorrect="off" spellcheck="false"/></div>`;
}
function buildMemory(q) {
  // Flatten and shuffle pairs
  let cards = [];
  q.pairs.forEach((pair,i) => { cards.push({id:i+'a',pairId:i,text:pair[0]}); cards.push({id:i+'b',pairId:i,text:pair[1]}); });
  cards = cards.sort(()=>Math.random()-0.5);
  quiz.memPairs = cards;
  const wrap = document.createElement('div');
  wrap.innerHTML = `<div class="memory-instructions">Toca dos tarjetas para emparejar concepto con definición</div>`;
  const grid = document.createElement('div'); grid.className = 'memory-grid'; grid.id = 'memory-grid';
  cards.forEach(c => {
    const el = document.createElement('div');
    el.className = 'mem-card'; el.dataset.id = c.id; el.dataset.pairId = c.pairId;
    el.textContent = c.text;
    el.addEventListener('click', () => onMemCardClick(c.id, c.pairId));
    grid.appendChild(el);
  });
  wrap.appendChild(grid);
  return wrap;
}
function buildOrder(q) {
  let items = q.items.map((t,i)=>({text:t,origIdx:i})).sort(()=>Math.random()-0.5);
  quiz.orderItems = items;
  quiz.orderSelected = [];
  const wrap = document.createElement('div');
  // Header row: instructions + reset button
  const header = document.createElement('div');
  header.style.cssText = 'display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px;';
  header.innerHTML = `
    <div class="memory-instructions" style="margin-bottom:0;flex:1;">Toca los elementos en el orden correcto (1 → último)</div>
    <button id="order-reset-btn" onclick="resetOrder()" style="
      background:transparent;border:1px solid #3a2e1e;color:var(--text-soft);
      border-radius:8px;padding:5px 12px;font-family:'Cinzel',serif;font-size:0.68rem;
      cursor:pointer;letter-spacing:1px;white-space:nowrap;flex-shrink:0;
      touch-action:manipulation;transition:all 0.2s;
    ">↺ Reiniciar</button>
  `;
  wrap.appendChild(header);
  const list = document.createElement('div'); list.className = 'order-list'; list.id = 'order-list';
  items.forEach((item,i) => {
    const el = document.createElement('div');
    el.className = 'order-item'; el.dataset.idx = i;
    el.innerHTML = `<span class="order-num" id="onum-${i}">·</span><span>${item.text}</span>`;
    el.addEventListener('click', () => onOrderClick(i));
    list.appendChild(el);
  });
  wrap.appendChild(list);
  return wrap;
}

function resetOrder() {
  if (quiz.answered) return;
  quiz.orderSelected = [];
  quiz.orderItems.forEach((_, i) => {
    const el = document.querySelector(`[data-idx="${i}"]`);
    if (el) {
      el.classList.remove('selected-order', 'correct', 'wrong');
      document.getElementById(`onum-${i}`).textContent = '·';
    }
  });
}

// ── INTERACTIONS ────────────────────────────────────────
let mcSelected = null, tfSelected = null;

function selectChoice(i) {
  if (quiz.answered) return;
  mcSelected = i;
  document.querySelectorAll('.choice-btn').forEach((b,idx) => {
    b.classList.toggle('selected', idx===i);
  });
}
function selectTF(val) {
  if (quiz.answered) return;
  tfSelected = val;
  document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('selected'));
  document.querySelector(`.tf-btn:${val?'first':'last'}-child`).classList.add('selected');
}

function onMemCardClick(id, pairId) {
  if (quiz.answered) return;
  const q = MODULES[quiz.moduleIdx].questions[quiz.questionIdx];
  const el = document.querySelector(`[data-id="${id}"]`);
  if (el.classList.contains('matched')) return;
  if (quiz.memSelected === id) { el.classList.remove('selected'); quiz.memSelected = null; return; }
  if (quiz.memSelected !== null) {
    const prevEl = document.querySelector(`[data-id="${quiz.memSelected}"]`);
    const prevPairId = parseInt(prevEl.dataset.pairId);
    const curPairId = parseInt(pairId);
    if (prevPairId === curPairId && quiz.memSelected !== id) {
      // Match!
      el.classList.add('matched'); prevEl.classList.add('matched');
      quiz.memMatched.push(pairId);
      quiz.memSelected = null;
      if (quiz.memMatched.length === q.pairs.length) {
        setTimeout(() => { showFeedback(true, q.feedback); quiz.answered = true; updateNextBtn(); }, 300);
      }
    } else {
      el.classList.add('selected');
      // Wrong pair — flash and reset
      setTimeout(() => {
        el.classList.add('wrong-flash'); prevEl.classList.add('wrong-flash');
        setTimeout(() => { el.classList.remove('selected','wrong-flash'); prevEl.classList.remove('selected','wrong-flash'); }, 600);
      }, 100);
      quiz.memSelected = null;
    }
  } else {
    quiz.memSelected = id;
    el.classList.add('selected');
  }
}

function onOrderClick(idx) {
  if (quiz.answered) return;
  const el = document.querySelector(`[data-idx="${idx}"]`);
  if (el.classList.contains('correct') || el.classList.contains('wrong')) return;
  // If already selected, tapping again deselects it and all after it
  if (quiz.orderSelected.includes(idx)) {
    const pos = quiz.orderSelected.indexOf(idx);
    const toRemove = quiz.orderSelected.splice(pos);
    toRemove.forEach(i => {
      const removed = document.querySelector(`[data-idx="${i}"]`);
      if (removed) { removed.classList.remove('selected-order'); document.getElementById(`onum-${i}`).textContent = '·'; }
    });
    return;
  }
  quiz.orderSelected.push(idx);
  const num = quiz.orderSelected.length;
  document.getElementById(`onum-${idx}`).textContent = num;
  el.classList.add('selected-order');
  // Update confirm button text when all selected
  const q = MODULES[quiz.moduleIdx].questions[quiz.questionIdx];
  if (quiz.orderSelected.length === q.items.length) {
    const btn = document.getElementById('next-btn');
    if (btn) btn.textContent = 'Confirmar orden ✓';
  }
}

function checkOrderAnswer() {
  const q = MODULES[quiz.moduleIdx].questions[quiz.questionIdx];
  if (quiz.orderSelected.length < q.items.length) { showToast('Ordena todos los elementos primero'); return false; }
  const correct = quiz.orderSelected.every((selIdx, pos) => {
    return quiz.orderItems[selIdx].origIdx === q.correctOrder[pos];
  });
  quiz.orderSelected.forEach((selIdx, pos) => {
    const el2 = document.querySelector(`[data-idx="${selIdx}"]`);
    const isCorrect = quiz.orderItems[selIdx].origIdx === q.correctOrder[pos];
    el2.classList.remove('selected-order');
    el2.classList.add(isCorrect ? 'correct' : 'wrong');
  });
  // Hide reset button after confirming
  const resetBtn = document.getElementById('order-reset-btn');
  if (resetBtn) resetBtn.style.display = 'none';
  showFeedback(correct, q.feedback);
  if (correct) quiz.correct++;
  return true;
}

function onNextOrConfirm() {
  const mod = MODULES[quiz.moduleIdx];
  const q = mod.questions[quiz.questionIdx];

  if (!quiz.answered) {
    // Confirm answer
    if (q.type === 'mc') {
      if (mcSelected === null) { showToast('Selecciona una opción'); return; }
      const correct = mcSelected === q.answer;
      document.querySelectorAll('.choice-btn').forEach((b,i) => {
        if (i===q.answer) b.classList.add('correct');
        else if (i===mcSelected && !correct) b.classList.add('wrong');
        b.classList.remove('selected');
      });
      if (correct) quiz.correct++;
      showFeedback(correct, q.feedback);
    } else if (q.type === 'tf') {
      if (tfSelected === null) { showToast('Selecciona Verdadero o Falso'); return; }
      const correct = tfSelected === q.answer;
      document.querySelectorAll('.tf-btn').forEach(b => {
        const isTrue = b.textContent.includes('Verdadero');
        if (isTrue === q.answer) b.classList.add('correct');
        else if (isTrue === tfSelected && !correct) b.classList.add('wrong');
        b.classList.remove('selected');
      });
      if (correct) quiz.correct++;
      showFeedback(correct, q.feedback);
    } else if (q.type === 'fill') {
      const inp = document.getElementById('fill-input');
      const val = inp.value.trim().toLowerCase();
      const correct = val === q.answer.toLowerCase() || val.includes(q.answer.toLowerCase());
      inp.classList.add(correct ? 'correct' : 'wrong');
      inp.disabled = true;
      if (correct) quiz.correct++;
      showFeedback(correct, q.feedback);
    } else if (q.type === 'memory') {
      showToast('Completa la actividad primero'); return;
    } else if (q.type === 'order') {
      const ok = checkOrderAnswer();
      if (!ok) return;
    }
    quiz.answered = true;
    mcSelected = null; tfSelected = null;
    updateNextBtn();
  } else {
    // Next question or finish
    if (quiz.questionIdx < mod.questions.length - 1) {
      quiz.questionIdx++;
      renderQuestion();
      document.getElementById('app').scrollTo(0,0);
    } else {
      finishModule();
    }
  }
}

function updateNextBtn() {
  const mod = MODULES[quiz.moduleIdx];
  const btn = document.getElementById('next-btn');
  if (btn) btn.textContent = quiz.questionIdx < mod.questions.length-1 ? 'Siguiente →' : 'Finalizar módulo';
}

function showFeedback(correct, msg) {
  const fb = document.getElementById('feedback-box');
  fb.className = 'feedback-box ' + (correct ? 'correct' : 'wrong');
  fb.style.display = 'block';
  fb.innerHTML = `<div class="feedback-icon">${correct ? '✅' : '❌'}</div>${msg}`;
}

// ══════════════════════════════════════════════════════════
// MODULE COMPLETE
// ══════════════════════════════════════════════════════════
function finishModule() {
  const mod = MODULES[quiz.moduleIdx];
  const prevRank = getCurrentRank();

  // Update state
  if (!state.completedModules.includes(mod.id)) state.completedModules.push(mod.id);
  const prevScore = state.scores[mod.id] || 0;
  state.scores[mod.id] = quiz.correct;
  const scoreDiff = quiz.correct - prevScore;
  if (scoreDiff > 0) state.totalCorrect = Math.min(MODULES.length*5, state.totalCorrect + scoreDiff);
  if (!prevScore) state.totalCorrect = Math.min(MODULES.length*5, state.totalCorrect + quiz.correct - (prevScore||0));

  // Recalculate total properly
  state.totalCorrect = Object.values(state.scores).reduce((a,b)=>a+b,0);
  saveState();
  updateTopBar();

  const newRank = getCurrentRank();
  const rankChanged = newRank.name !== prevRank.name;

  hide('quiz-screen');
  show('module-complete');
  document.getElementById('app').scrollTo(0,0);

  const pct = Math.round((quiz.correct/mod.questions.length)*100);
  const stars = quiz.correct >= 5 ? '⭐⭐⭐' : quiz.correct >= 4 ? '⭐⭐' : quiz.correct >= 3 ? '⭐' : '';
  const msgs = ['Sigue estudiando, la Verdad vale el esfuerzo.','Bien, pero hay más por aprender.','¡Buen trabajo! La Palabra va echando raíces.','¡Excelente! Demuestras verdadero conocimiento.','¡Perfecto! Eres un Siervo de Cristo en formación.'];

  document.getElementById('mc-icon').textContent = mod.icon;
  document.getElementById('mc-title').textContent = `${mod.title} — Completado`;
  document.getElementById('mc-stars').textContent = stars;
  document.getElementById('mc-score').textContent = `${quiz.correct} / ${mod.questions.length}`;
  document.getElementById('mc-msg').textContent = msgs[Math.min(quiz.correct, msgs.length-1)];

  const nextBtn = document.getElementById('mc-next-btn');
  const nextIdx = quiz.moduleIdx + 1;
  if (nextIdx < MODULES.length) {
    nextBtn.textContent = `Siguiente: ${MODULES[nextIdx].title} →`;
    nextBtn.onclick = () => startModule(nextIdx);
  } else {
    nextBtn.textContent = '🏆 Ver resumen final';
    nextBtn.onclick = goHome;
  }

  if (rankChanged) setTimeout(() => showRankUnlock(newRank), 800);
}

function showRankUnlock(rank) {
  document.getElementById('ru-icon').textContent = rank.icon;
  document.getElementById('ru-name').textContent = rank.name;
  document.getElementById('ru-desc').textContent = rank.desc;
  const el = document.getElementById('rank-unlock');
  el.style.display = 'flex';
}
function closeRankUnlock() { document.getElementById('rank-unlock').style.display = 'none'; }

// ══════════════════════════════════════════════════════════
// UTILS
// ══════════════════════════════════════════════════════════
function show(id) {
  const el = document.getElementById(id);
  if (id === 'rank-unlock') el.style.display = 'flex';
  else el.style.display = 'block';
}
function hide(id) { document.getElementById(id).style.display = 'none'; }

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.className='', 2200);
}

function saveState() {
  localStorage.setItem('falsedad_completed', JSON.stringify(state.completedModules));
  localStorage.setItem('falsedad_scores', JSON.stringify(state.scores));
  localStorage.setItem('falsedad_total', state.totalCorrect);
}

// ══════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════
hide('home'); hide('quiz-screen'); hide('module-complete'); hide('rank-unlock');
renderHome();
</script>
</body>
